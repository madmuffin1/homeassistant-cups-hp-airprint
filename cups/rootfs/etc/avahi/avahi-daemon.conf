[server]
# This will advertise as homeassistant.local
host-name=homeassistant
domain-name=local

[wide-area]
enable-wide-area=no

[publish]
publish-hinfo=no
publish-workstation=no
publish-domain=yes
# Address records stay published here. Supervisor's hassio_multicast is only an
# mdns-repeater, not a responder, so nothing else on this host is guaranteed to
# publish homeassistant.local -- and that name is the SRV target of the printer
# service advertised below. Avahi's "another mDNS stack" warning comes from the
# repeater holding port 5353 and is unavoidable, not a record conflict.
publish-addresses=yes