[server]
# This will advertise as homeassistant.local
host-name=homeassistant
domain-name=local

[wide-area]
enable-wide-area=no

[publish]
publish-hinfo=no
publish-workstation=no
publish-domain=yes
# Supervisor's hassio_multicast plugin already runs an Avahi on this host and
# publishes the host's address records. Republishing them from here is what
# triggers avahi's "another mDNS stack" warning, so only the printer service is
# advertised; the SRV target resolves via the Supervisor's responder.
publish-addresses=no