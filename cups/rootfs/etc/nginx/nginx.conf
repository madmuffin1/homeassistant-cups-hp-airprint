# Reverse proxy that makes the CUPS web interface usable through HA ingress.
#
# Two things stop CUPS from working in an ingress panel:
#   1. It sends "X-Frame-Options: DENY" and "Content-Security-Policy:
#      frame-ancestors 'none'". Ingress renders add-on UIs in an iframe, so the
#      browser blocks the render and the panel is blank.
#   2. It emits absolute links (/cups.css, /admin, ...), while ingress serves
#      the add-on under /api/hassio_ingress/<token>/. Those links would 404.
#
# CUPS has no configuration for either, so both are handled here.

user root;
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
daemon off;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 65;

    # Print jobs submitted through the web UI can be large.
    client_max_body_size 0;

    server {
        listen 8099 default_server;
        listen [::]:8099 default_server;

        # Reachable from the Supervisor (ingress) and from inside the container
        # only. The add-on runs with host_network, so without this the panel
        # would also be served to the whole LAN.
        #
        # 172.30.0.0/16 covers every Supervisor-managed network: ingress
        # arrives from the Supervisor's own network (172.30.232.0/23 here), not
        # from the hassio bridge (172.30.32.0/23), and which one is used is not
        # contractual. The LAN stays excluded either way.
        allow 172.30.0.0/16;
        allow 127.0.0.1;
        allow ::1;
        deny all;

        location / {
            proxy_pass http://127.0.0.1:631;
            proxy_http_version 1.1;

            proxy_set_header Host 127.0.0.1:631;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";

            # sub_filter cannot rewrite a compressed body.
            proxy_set_header Accept-Encoding "";

            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;

            sub_filter 'href="/'   'href="$http_x_ingress_path/';
            sub_filter 'src="/'    'src="$http_x_ingress_path/';
            sub_filter 'action="/' 'action="$http_x_ingress_path/';
            sub_filter 'url(/'     'url($http_x_ingress_path/';
            sub_filter_once off;
            # text/html is always filtered; listing it again warns at startup.
            sub_filter_types text/css application/javascript;

            proxy_redirect http://127.0.0.1:631/ $http_x_ingress_path/;
        }
    }
}
